name: CI Pipeline

on:
  push:
    branches:
      - '**'  # Любой коммит в любую ветку запускает пайплайн
  pull_request:
    branches:
      - main
      - development
      - release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # Кэширование зависимостей Gradle

      - name: Установка Gradle
        uses: gradle/gradle-build-action@v2

      - name: Сборка и тесты
        run: |
          ./gradlew build --no-daemon